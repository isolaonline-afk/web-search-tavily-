<!DOCTYPE html>
<html lang="it">
<head><meta charset="UTF-8"><title>Brave Search</title></head>
<body>
<script>
window['ai_edge_gallery_get_result'] = async (data, secret) => {
    try {
        const params = JSON.parse(data);
        const query = params.query;
        if (!query || !secret) return JSON.stringify({ error: "Dati o Key mancanti." });

        // Chiamata ufficiale all'endpoint di Brave
        const url = `https://api.search.brave.com/res/v1/web/search?q=${encodeURIComponent(query)}&count=3`;
        const response = await fetch(url, {
            method: 'GET',
            headers: { 
                'Accept': 'application/json',
                'X-Subscription-Token': secret
            }
        });
        
        if (!response.ok) return JSON.stringify({ error: `HTTP ${response.status}` });
        const searchData = await response.json();
        
        if (!searchData.web || !searchData.web.results) return JSON.stringify({ result: "Nessun risultato trovato." });
        
        // Estrazione pulita dei nodi principali per non appesantire il contesto dell'iPhone
        const snippets = searchData.web.results.map(item => {
            return `Fonte: ${item.title}\nURL: ${item.url}\nContesto:\n${item.description}`;
        }).join('\n\n');
        
        return JSON.stringify({ result: snippets });
    } catch (e) { return JSON.stringify({ error: e.message }); }
};
</script>
</body>
</html>
