<!DOCTYPE html>
<html lang="it">
<head><meta charset="UTF-8"><title>Tavily Search</title></head>
<body>
<script>
window['ai_edge_gallery_get_result'] = async (data, secret) => {
    try {
        const params = JSON.parse(data);
        const query = params.query;
        if (!query || !secret) return JSON.stringify({ error: "Dati o Key mancanti." });

        // Chiamata POST ufficiale all'endpoint di Tavily
        const response = await fetch('https://api.tavily.com/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                api_key: secret,
                query: query,
                search_depth: "advanced",
                include_answer: false,
                max_results: 3
            })
        });
        
        if (!response.ok) return JSON.stringify({ error: `HTTP ${response.status}` });
        const searchData = await response.json();
        
        if (!searchData.results || searchData.results.length === 0) return JSON.stringify({ result: "Nessun risultato trovato." });
        
        // Formattazione pulita dei contesti per il modello locale
        const snippets = searchData.results.map(item => {
            return `Fonte: ${item.title}\nURL: ${item.url}\nContesto:\n${item.content}`;
        }).join('\n\n');
        
        return JSON.stringify({ result: snippets });
    } catch (e) { return JSON.stringify({ error: e.message }); }
};
</script>
</body>
</html>
