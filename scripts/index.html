<!DOCTYPE html>
<html lang="it">
<head><meta charset="UTF-8"><title>Exa Search</title></head>
<body>
<script>
window['ai_edge_gallery_get_result'] = async (data, secret) => {
    try {
        const params = JSON.parse(data);
        const query = params.query;
        if (!query || !secret) return JSON.stringify({ error: "Dati o Key mancanti." });

        // Chiamata POST ufficiale all'endpoint di Exa
        const response = await fetch('https://api.exa.ai/search', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'x-api-key': secret
            },
            body: JSON.stringify({ 
                query: query, 
                type: "auto", 
                numResults: 3,
                contents: { highlights: true } 
            })
        });
        
        if (!response.ok) return JSON.stringify({ error: `HTTP ${response.status}` });
        const searchData = await response.json();
        
        // Estrazione pulita dei soli passaggi salienti (Highlights)
        const snippets = searchData.results.map(item => {
            const highlightText = Array.isArray(item.highlights) ? item.highlights.join('\n') : (item.highlights || '');
            return `Fonte: ${item.title}\nURL: ${item.url}\nContesto:\n${highlightText}`;
        }).join('\n\n');
        
        return JSON.stringify({ result: snippets });
    } catch (e) { return JSON.stringify({ error: e.message }); }
};
</script>
</body>
</html>
