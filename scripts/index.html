<!DOCTYPE html>
<html lang="it">
<head><meta charset="UTF-8"><title>Search</title></head>
<body>
<script>
window['ai_edge_gallery_get_result'] = async (data, secret) => {
    try {
        const params = JSON.parse(data);
        const query = params.query;
        if (!query || !secret) return JSON.stringify({ error: "Dati o Key mancanti." });

        const response = await fetch('https://api.tavily.com/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ api_key: secret, query: query, search_depth: "basic", max_results: 3 })
        });
        
        if (!response.ok) return JSON.stringify({ error: `HTTP ${response.status}` });
        const searchData = await response.json();
        const snippets = searchData.results.map(item => `Fonte: ${item.title}\nContenuto: ${item.content}`).join('\n\n');
        return JSON.stringify({ result: snippets });
    } catch (e) { return JSON.stringify({ error: e.message }); }
};
</script>
</body>
</html>
